<title>Sualver.az + Туалет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: a social feed in one narrow column. Stories on top (projects with a progress ring, people),
   posts with likes and comments, a tab bar at the bottom: feed, goals, new post, profile. */
:root {
  --bg: #eef1ef; --surface: #ffffff; --sunk: #dde4e1; --ink: #13201e; --muted: #53625e; --line: #d0d9d5;
  --ruslan: #3451d1; --seymur: #b02a78; --sual: #c9441b; --toilet: #1b7f76;
  --add: #1d7333; --chg: #586a66; --fix: #7d3fc4; --rem: #c4183c; --like: #d6204b;
  --shadow: 0 1px 2px rgba(19,32,30,.05), 0 8px 24px -12px rgba(19,32,30,.18);
  /* covers keep their own colours in both themes: Sualver.az brand orange, the game's water green */
  --cover-sual: linear-gradient(150deg, #c44318, #86270e); --cover-toilet: linear-gradient(150deg, #1a7a71, #123a37); --cover-none: linear-gradient(150deg, #44524f, #1c2625);
  --fresh: conic-gradient(from 210deg, #ffb347, #ff5a5f, #c13584, #ffb347);
  --f: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --d: "Unbounded", "Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1112; --surface: #131b1c; --sunk: #1f2a2b; --ink: #e7efed; --muted: #93a4a0; --line: #263233;
    --ruslan: #92a5ff; --seymur: #f08cc4; --sual: #ff8355; --toilet: #6fd0c5;
    --add: #6fd08a; --chg: #9fb0ac; --fix: #c9a0f5; --rem: #ff7b93; --like: #ff6685;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1112; --surface: #131b1c; --sunk: #1f2a2b; --ink: #e7efed; --muted: #93a4a0; --line: #263233;
  --ruslan: #92a5ff; --seymur: #f08cc4; --sual: #ff8355; --toilet: #6fd0c5;
  --add: #6fd08a; --chg: #9fb0ac; --fix: #c9a0f5; --rem: #ff7b93; --like: #ff6685;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f); font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 520px; margin: 0 auto; padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p, figure { margin: 0; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 600; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ruslan); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 500; transition: border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 10px 16px; font-weight: 600; }
.link { background: none; border: 0; padding: 0; font-weight: 600; }
.view { display: flex; flex-direction: column; gap: 20px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.shrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.pm { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--muted); }
.pm.sual { background: var(--sual); } .pm.toilet { background: var(--toilet); }
.ava { width: 32px; height: 32px; border-radius: 50%; color: var(--bg); font-size: 14px; font-weight: 600; display: grid; place-items: center; background: var(--muted); flex: none; }
.ava { overflow: hidden; } .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava.ruslan { background: var(--ruslan); } .ava.seymur { background: var(--seymur); }
.ava.sm { width: 24px; height: 24px; font-size: 12px; } .ava.st { width: 58px; height: 58px; font-size: 24px; } .ava.big { width: 84px; height: 84px; font-size: 34px; }

/* top bar, stories, tab bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { background: none; border: 0; padding: 0; font-size: 20px; font-weight: 600; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.story { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px; flex: none; }
.ring { --pcol: var(--line); width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--pcol) calc(var(--v, 100) * 1%), var(--sunk) 0); transition: transform .15s; }
.ring.all { --pcol: var(--ink); } .ring.sual { --pcol: var(--sual); } .ring.toilet { --pcol: var(--toilet); } .ring.fresh { --pcol: var(--like); }
.ring b { width: 58px; height: 58px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 15px; font-weight: 600; }
.story:hover .ring { transform: scale(1.05); }
.story.on .ring { outline: 2px solid var(--ink); outline-offset: 2px; }
.sl { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story.on .sl { font-weight: 600; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: 0; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tabs button[aria-current="true"] { color: var(--ink); font-weight: 600; }
.tabs svg { width: 24px; height: 24px; }

/* posts */
.feed { display: flex; flex-direction: column; gap: 20px; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; scroll-margin-top: 12px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.phd { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 14px; }
.phd .who2 { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; min-width: 0; }
.phd .when { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.media { background: var(--sunk); }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2px; align-items: start; }
.ba-frame { width: 100%; max-width: var(--mw, 100%); margin: 0 auto; aspect-ratio: var(--far, auto); overflow: hidden; }
.ba-box { position: relative; width: 100%; aspect-ratio: var(--ar, 9 / 19.5); --x: 50; }
.ba-box img { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
.ba-side { position: absolute; inset: 0; background: var(--sunk); clip-path: inset(0 0 0 calc(var(--x) * 1%)); }
.marks { position: absolute; top: 0; left: 0; width: 100%; aspect-ratio: var(--aar, auto); pointer-events: none; }
.mark { position: absolute; transform: translate(-50%, -50%); border: 3px solid #ff3b30; outline: 2px solid #fff; border-radius: 50%; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.1); opacity: .65; } }
.ba-line { position: absolute; top: 0; bottom: 0; left: calc(var(--x) * 1%); width: 2px; margin-left: -1px; background: #fff; outline: 1px solid rgba(0,0,0,.45); pointer-events: none; }
.ba-line::after { content: "↔"; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: #fff; color: #14171c; border: 1px solid rgba(0,0,0,.45); display: grid; place-items: center; font-size: 16px; }
.ba-tag { position: absolute; top: 8px; font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: rgba(15,17,21,.75); color: #fff; pointer-events: none; }
.ba-tag.l { left: 8px; } .ba-tag.r { right: 8px; }
.ba-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.zoom { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; border: 0; border-radius: 6px; background: rgba(15,17,21,.78); color: #fff; font-size: 18px; }
.single { display: block; width: 100%; max-width: var(--mw, 100%); margin: 0 auto; cursor: zoom-in; }
.poster { --pcol: var(--muted); padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; background: var(--cover, var(--cover-none)); color: #fff; }
.poster.sual, .mini.sual { --cover: var(--cover-sual); } .poster.toilet, .mini.toilet { --cover: var(--cover-toilet); }
.poster h2 { font-size: 26px; line-height: 1.18; }
.poster ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 18px; line-height: 1.35; }
.poster li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.poster p { font-size: 17px; }
.g { font-weight: 600; text-align: center; }
.c-add { color: var(--add); } .c-chg { color: var(--chg); } .c-fix { color: var(--fix); } .c-rem { color: var(--rem); }
.gain { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.chip.up { border-color: var(--add); color: var(--add); }
.acts { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; }
.act { background: none; border: 0; padding: 6px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; border-radius: 8px; }
.act svg { width: 24px; height: 24px; transition: transform .15s; }
.act:active svg { transform: scale(.85); }
.act[aria-pressed="true"] { color: var(--like); }
.act[aria-pressed="true"] svg path { fill: currentColor; }
.act.text { font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); min-height: 32px; }
.act.text.first { margin-left: auto; }
.pbody { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.cap b { font-weight: 600; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { --pc: var(--chg); font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 20px; color: var(--pc); background: color-mix(in srgb, var(--pc) 14%, var(--surface)); }
.pill.add { --pc: var(--add); } .pill.chg { --pc: var(--chg); } .pill.fix { --pc: var(--fix); } .pill.rem { --pc: var(--rem); }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.items li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
details > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details[open] > summary { margin-bottom: 8px; }
.thread { display: flex; flex-direction: column; gap: 8px; }
.clist { display: flex; flex-direction: column; gap: 6px; }
.clist:empty { display: none; }
.cm { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 14px; }
.cm p { overflow-wrap: anywhere; } .cm b { font-weight: 600; } .cm time { color: var(--muted); font-size: 12px; margin-left: 6px; }
.x { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0 6px; min-width: 28px; }
.x.armed, .armed { color: var(--rem); }
.cform { display: flex; gap: 8px; }
.cform input { flex: 1; min-width: 0; }
input[type="text"], select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; resize: vertical; }
.mini { --pcol: var(--muted); position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px; text-align: left; background: var(--cover, var(--cover-none)); color: #fff; overflow: hidden; }
.mini b { font-size: 18px; line-height: 1.2; } .mini i { font-style: normal; font-size: 13px; line-height: 1.25; font-weight: 500; overflow-wrap: anywhere; }

/* goals tab */
.proj { display: flex; flex-direction: column; gap: 6px; }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ph a { font-weight: 600; text-decoration: none; }
.pct { font-size: 26px; line-height: 1; font-weight: 600; }
.bar2 { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.bar2 i { display: block; height: 100%; border-radius: 5px; background: var(--ink); transition: width .4s; }
.bar2 i.sual { background: var(--sual); } .bar2 i.toilet { background: var(--toilet); }
.bar2.thin { height: 6px; }
.prow { display: flex; flex-direction: column; gap: 6px; }
.pn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.sbar { display: flex; height: 16px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.sbar i { display: block; height: 100%; transform-origin: left; animation: grow .5s ease-out; }
@keyframes grow { from { transform: scaleX(0); } }
.sbar .add { background: var(--add); } .sbar .chg { background: var(--chg); } .sbar .fix { background: var(--fix); } .sbar .rem { background: var(--rem); }
.cbtn { background: none; border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; font-size: 13px; color: var(--muted); min-height: 32px; }
.cbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.gh { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 8px; }
.gh .bar2 { grid-column: 1 / -1; }
.goal { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; padding: 6px 0; }
.goal.done { opacity: .55; } .goal.done .gt { text-decoration: line-through; }
.check { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 6px; background: var(--surface); display: grid; place-items: center; padding: 0; transition: background .2s, border-color .2s; }
.check[aria-pressed="true"] { background: var(--add); border-color: var(--add); }
.check[aria-pressed="true"]::after { content: ""; width: 10px; height: 6px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.gadd { display: flex; gap: 8px; margin-top: 8px; }
.gadd input { flex: 1; min-width: 0; } .gadd select { max-width: 120px; }

/* new post */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 14px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); }
.err { color: var(--rem); font-size: 14px; }
.prev { max-width: 160px; border-radius: 8px; }

/* profile */
.phead { display: flex; gap: 16px 24px; align-items: center; flex-wrap: wrap; }
.pstats { display: flex; gap: 24px; text-align: center; }
.pstats b { display: block; font-size: 20px; line-height: 1.2; } .pstats span { font-size: 13px; color: var(--muted); }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.ptile { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: var(--surface); overflow: hidden; border-radius: 4px; }
.ptile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.ptile .cap2 { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: 11px; font-weight: 500; background: rgba(15,17,21,.78); color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tile b { display: block; font-size: 17px; line-height: 1.2; font-weight: 600; } .tile span { font-size: 12px; color: var(--muted); }
.mrow { display: grid; grid-template-columns: 80px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.by-ruslan { --pc: var(--ruslan); } .by-seymur { --pc: var(--seymur); }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ach { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.ach.got { background: var(--surface); color: var(--ink); border-color: var(--pc); font-weight: 600; }
.ach .bar2 i { background: var(--pc); }

.media.crop { position: relative; max-height: 560px; overflow: hidden; }
.media.crop.open { max-height: none; }
.uncrop { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); border: 0; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; background: rgba(15,17,21,.82); color: #fff; }
.media.fits .uncrop, .media.open .uncrop { display: none; }
.bar:has(.who:empty) { display: none; }
.tabs button { font-size: 12px; }
.tabs .plus svg { width: 38px; height: 38px; padding: 7px; border-radius: 12px; background: var(--ink); color: var(--bg); }
.tabs .plus { gap: 0; justify-content: center; }
.ptile .cap2 { font-size: 12px; }
/* before/after divider: dragged by its handle only, so a vertical swipe on the picture still scrolls */
.ba-line::after { display: none; }
.ba-range { pointer-events: none; }
.ba-handle { position: absolute; top: 50%; left: calc(var(--x) * 1%); width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #fff; color: #14171c; border: 1px solid rgba(0,0,0,.45); display: grid; place-items: center; font-size: 18px; cursor: ew-resize; touch-action: none; user-select: none; }
.ba-range:focus-visible ~ .ba-handle { outline: 3px solid var(--ruslan); outline-offset: 2px; }

/* reels: one post per screen, the scroll snaps */
.tabs div { grid-template-columns: repeat(5, 1fr); }
.tabs button[aria-current="true"]::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.tabs .plus svg { border-radius: 50%; width: 44px; height: 44px; padding: 9px; }
.reels { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.reel { height: 100%; max-width: 520px; margin: 0 auto; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; }
.rmedia { position: relative; flex: 1; min-height: 0; display: grid; place-items: start center; overflow: hidden; background: var(--sunk); }
.rmedia .shots { width: 100%; grid-template-columns: 1fr; padding-top: 20px; }
/* a screenshot keeps at least 70% of the column width; whatever is taller than the screen is cut at the bottom */
.rmedia .ba-frame { max-width: none; width: max(70%, min(100%, calc((100dvh - 200px) * var(--far, .46)))); }
.rmedia .single { width: max(70%, min(100%, calc((100dvh - 200px) * .46))); max-width: none; cursor: default; }
.rmedia .zoom { display: none; }
.rmedia .poster { width: 100%; height: 100%; justify-content: flex-start; padding: 48px 24px 24px; gap: 20px; }
.rmedia .poster h2 { font-size: 34px; line-height: 1.12; }
.rmedia .poster ul { font-size: 20px; gap: 14px; }
.rmedia .poster p { font-size: 19px; }
.rinfo { flex: none; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); }
.rinfo .phd { padding: 0; }
.ract { display: flex; align-items: center; gap: 6px; }
.ract .btn { min-height: 40px; }
.ract .last { margin-left: auto; }
.rclamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rprog { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(12px, calc(50% - 248px)); right: max(12px, calc(50% - 248px)); z-index: 16; display: flex; gap: 4px; pointer-events: none; }
.rprog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(127,127,127,.45); }
.rprog i.on { background: var(--ink); }
.rhint { position: fixed; left: 50%; bottom: calc(170px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 16; padding: 8px 16px; border-radius: 20px; background: rgba(15,17,21,.82); color: #fff; font-size: 14px; font-weight: 600; pointer-events: none; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, 6px); } }

    const u = S.updates.find((x) => x.id === id);
    if (!u) return;
    const now = Date.now(), data = { project: u.project, group: groupsOf(u.project)[0].id, title: u.title, done: false, removed: false, order: now, createdAt: now, createdBy: myPerson() || "", doneAt: 0, doneBy: "", fromPost: id };
    try {
      const ref = await S.db.collection("goals").add(data);
      await S.db.doc("updates/" + id).update({ goalId: ref.id });
      await logEvent("goal_added", { id: ref.id, ...data });
      toast("Добавлено в цели: " + proj(u.project).name);
    } catch { fail(); }
    return;
  }
  if (a === "toggle" && g) {
    const done = !g.done;
    g.done = done; S.keep.add(id); render();
    try {
      await S.db.doc("goals/" + id).update(done ? { done, doneAt: Date.now(), doneBy: myPerson() || "" } : { done, doneAt: 0, doneBy: "" });
      await logEvent(done ? "goal_done" : "goal_reopened", g);
    } catch { g.done = !done; render(); fail(); }
    return;
  }
  if (a === "remove-goal" && g) {
    if (!arm(b, "убрать?")) return;
    try { await S.db.doc("goals/" + id).update({ removed: true, removedAt: Date.now() }); await logEvent("goal_removed", g); } catch { fail(); }
  }
});
// One wheel step or arrow key moves exactly one post; touch uses the native snap.
let reelBusy = 0;
function reelStep(dir) {
  const box = $("v-reels"), h = box.clientHeight, n = box.querySelectorAll(".reel").length;
  const i = Math.max(0, Math.min(n - 1, Math.round(box.scrollTop / h) + dir));
  box.scrollTo({ top: i * h, behavior: still() ? "auto" : "smooth" });
}
$("v-reels").addEventListener("wheel", (e) => {
  e.preventDefault();
  if (Math.abs(e.deltaY) < 4) return;
  // While wheel events keep coming (a trackpad's inertia), the lock is extended, so one gesture is one post.
  if (Date.now() < reelBusy) { reelBusy = Math.max(reelBusy, Date.now() + 140); return; }
  reelBusy = Date.now() + 600;
  reelStep(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
let reelTick = false;
$("v-reels").addEventListener("scroll", () => { if (reelTick) return; reelTick = true; requestAnimationFrame(() => { reelTick = false; reelSync(); }); }, { passive: true });
document.addEventListener("keydown", (e) => {
  if (S.view !== "reels") return;
  if (e.key === "Escape") { if (!$("rsheet").hidden) closeSheet(); else setView("home"); return; }
  if (!$("rsheet").hidden || (e.target.closest && e.target.closest("input,textarea"))) return;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); reelStep(1); }
  if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); reelStep(-1); }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "comment") {
    const box = f.querySelector("input"), text = box.value.trim();
    if (!text) return;
    box.value = "";
    try { await S.db.collection("comments").add({ target: f.dataset.t, person: myPerson() || "", author: S.me || "", text, at: Date.now() }); } catch { box.value = text; fail(); }
    return;
  }
  if (f.dataset.form === "show") {
    const sid = f.dataset.id, it = S.showcase.find((x) => x.id === sid), err = $("sf-err"), btn = f.querySelector(".btn.main");
    const name = $("sf-name").value.trim(), repo = cleanRepo($("sf-repo").value), url = $("sf-url").value.trim(), note = $("sf-note").value.trim().slice(0, 80);
    const own = f.querySelector('[data-sown][aria-pressed="true"]'), file = $("sf-file").files[0];
    err.textContent = "";
    if (!name) { err.textContent = "Напишите название проекта."; $("sf-name").focus(); return; }
    if (repo && !/^[\w.-]+\/[\w.-]+$/.test(repo)) { err.textContent = "Репозиторий пишется как владелец/название, например antropos17/sual-az."; return; }
    if (url && !webUrl(url)) { err.textContent = "Ссылка должна начинаться с https:// и открываться из интернета."; return; }
    if (file && file.size > 15 * 1024 * 1024) { err.textContent = "Файл больше 15 МБ, сожмите его."; return; }
    if (S.sending) return;
    S.sending = true; btn.disabled = true;
    try {
      const data = { name, owner: own ? own.dataset.sown : myPerson() || "ruslan", shot: it ? it.shot || "" : "", repo, url, note };
      if (file && S.assets) data.shot = (await S.assets.upload(file)).id;
      if (it) await S.db.doc("showcase/" + sid).update(data);
      else { const now = Date.now(); await S.db.collection("showcase").add({ ...data, order: now, createdAt: now, createdBy: myPerson() || "" }); }
      S.showForm = null; toast(it ? "Сохранено." : `«${name}» добавлен в витрину.`); render();
    } catch { fail(); btn.disabled = false; }
    S.sending = false;
    return;
  }
  if (f.dataset.form === "project") {
    const name = $("pf-name").value.trim(), repo = $("pf-repo").value.trim().replace(/^(https?:\/\/)?(www\.)?github\.com\//i, "").replace(/\.git$/, "").replace(/\/+$/, "");
    const bad = (id, text) => { const el = $(id); el.setAttribute("aria-invalid", "true"); $(id + "-err").textContent = text; el.focus(); };
    for (const id of ["pf-name", "pf-repo"]) { $(id).removeAttribute("aria-invalid"); $(id + "-err").textContent = ""; }
    if (!name) return bad("pf-name", "Напишите название.");
    if (PKEYS.some((p) => proj(p).name.toLowerCase() === name.toLowerCase())) return bad("pf-name", "Такой проект уже есть.");
    if (repo && !/^[\w-]+\/[\w.-]+$/.test(repo)) return bad("pf-repo", "Формат: владелец/название");
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24);
    let id = "p-" + (slug || Math.random().toString(36).slice(2, 8));
    while (S.projects[id]) id += Math.random().toString(36).slice(2, 4);
    const sw = f.querySelector('.sw[aria-pressed="true"]');
    const groups = [...new Set($("pf-groups").value.split(",").map((x) => x.trim()).filter(Boolean))].slice(0, 8).map((n, i) => ({ id: "g" + (i + 1), name: n }));
    try {
      await S.db.doc("projects/" + id).set({ name, repo, color: sw ? sw.dataset.sw : "violet", groups, createdAt: Date.now(), createdBy: myPerson() || "" });
      S.projForm = false; toast(`Проект «${name}» добавлен. Цели — через «Править».`); render();
    } catch { fail(); }
    return;
  }
  const p = f.dataset.p, inp = $("add-" + p), title = inp.value.trim();
  if (!title) return;
  const now = Date.now();
  const data = { project: p, group: $("grp-" + p).value, title, done: false, removed: false, order: now, createdAt: now, createdBy: myPerson() || "", doneAt: 0, doneBy: "" };
  inp.value = "";
  try { const ref = await S.db.collection("goals").add(data); await logEvent("goal_added", { id: ref.id, ...data }); } catch { inp.value = title; fail(); }
});

document.addEventListener("change", (e) => {
  if (e.target.id !== "sf-file") return;
  const f = e.target.files[0], box = $("sf-prev");
  box.hidden = !f;
  if (f) { const img = document.createElement("img"); img.className = "prev"; img.alt = "Выбранный скриншот"; img.src = URL.createObjectURL(f); box.replaceChildren(img); }
});

/* new post */
$("n-file").addEventListener("change", (e) => {
  const f = e.target.files[0]; S.file = null; $("n-prev").hidden = true; $("n-err").textContent = "";
  if (!f) return;
  if (f.size > 15 * 1024 * 1024) { $("n-err").textContent = "Файл больше 15 МБ, сожмите его."; e.target.value = ""; return; }
  S.file = f;
  const img = document.createElement("img");
  img.className = "prev"; img.alt = "Выбранный скрин"; img.src = URL.createObjectURL(f);
  $("n-prev").replaceChildren(img); $("n-prev").hidden = false;
});
$("n-send").addEventListener("click", async () => {
  if (S.sending) return;
  const title = $("n-text").value.trim(), more = $("n-more").value.split("\n").map((x) => x.trim()).filter(Boolean);
  $("n-err").textContent = "";
  if (!S.db) { $("n-err").textContent = "Нет связи с общими данными."; return; }
  if (!title) { $("n-err").textContent = "Напишите хотя бы одну фразу."; $("n-text").focus(); return; }
  S.sending = true; $("n-send").disabled = true; $("n-send").textContent = "Публикую…";
  try {
    const shots = [];
    if (S.file && S.assets) { const r = await S.assets.upload(S.file); shots.push({ id: r.id, type: r.contentType, role: "after", pair: 0 }); }
    await S.db.collection("updates").add({ kind: S.kind, project: S.nproj, person: myPerson() || "", author: S.me || "", via: "hand", title, items: more, shots, visual: shots.length > 0, goalIds: [], commits: [], createdAt: Date.now() });
    $("n-text").value = ""; $("n-more").value = ""; $("n-file").value = ""; $("n-prev").hidden = true; S.file = null; $("n-extra").hidden = true; $("n-morebtn").hidden = false;
    S.filter = "all"; setView("home"); toast("Опубликовано");
  } catch (err) {
    $("n-err").textContent = err && err.code === "too_large" ? "Файл слишком большой." : "Не опубликовалось. Проверьте интернет и нажмите ещё раз.";
  } finally { S.sending = false; $("n-send").disabled = false; $("n-send").textContent = "Опубликовать"; }
});

function notePct() {
  for (const p of PKEYS) {
    const now = progress(goalsOf(p)).pct, before = S.lastPct[p];
    if (before !== undefined && before !== now) toast(`${proj(p).name}: ${before}% → ${now}%`);
    S.lastPct[p] = now;
  }
}

(async function boot() {
  S.onlyOpen = lsGet("st-open") !== "0";
  render();
  if (!window.claude || !window.claude.use) { $("status").textContent = "Откройте страницу в claude.ai."; return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) { $("status").textContent = "Нет доступа. Войдите в claude.ai и откройте страницу по приглашению."; return; }
  S.db = db;
  if (user) { S.me = await user.id(); const cw = await user.can("data.write"); S.canWrite = cw === null ? true : cw; }
  claude.use("assets").then((a) => { S.assets = a; $("n-filewrap").hidden = !a; });
  const slow = setTimeout(() => { $("status").textContent = "Данные пока не пришли. Страница подхватит их сама."; }, 10000);
  const ok = () => { clearTimeout(slow); $("status").textContent = ""; };
  const lost = () => { $("status").textContent = "Связь прервалась. Обновите страницу."; };
  const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  let first = true, firstC = true;
  db.collection("goals").onSnapshot((snap) => { S.goals = docs(snap); S.got.goals = true; ok(); notePct(); render(); }, lost);
  db.collection("updates").orderBy("createdAt", "desc").limit(300).onSnapshot((snap) => {
    S.updates = docs(snap);
    if (!S.seen) { const st = lsGet("st-seen"); S.seen = new Set(st === null ? S.updates.map((u) => u.id) : st.split(",")); }
    for (const u of S.updates) if (!S.seen.has(u.id)) { S.newIds.add(u.id); S.seen.add(u.id); }
    lsSet("st-seen", [...S.seen].join(","));
    if (!first) { const add = snap.docChanges().find((c) => c.type === "added" && !isMine(c.doc.data())); if (add) toast("Новый пост: " + add.doc.data().title); }
    first = false; S.got.updates = true; ok(); render();
  }, lost);
  db.collection("comments").orderBy("at", "asc").limit(1000).onSnapshot((snap) => {
    S.comments = docs(snap);
    if (!firstC) { const add = snap.docChanges().find((c) => c.type === "added" && c.doc.data().author !== S.me); if (add) toast("Новый комментарий: " + String(add.doc.data().text).slice(0, 60)); }
    firstC = false; render();
  }, lost);
  db.collection("likes").onSnapshot((snap) => { S.likes = withLikeWants(docs(snap)); renderActs(); }, lost);
  db.collection("events").orderBy("at", "desc").limit(500).onSnapshot((snap) => { S.events = docs(snap); }, lost);
  db.collection("projects").onSnapshot((snap) => { S.projects = Object.fromEntries(docs(snap).map((d) => [d.id, d])); syncProjects(); render(); }, lost);
  db.collection("showcase").onSnapshot((snap) => { S.showcase = docs(snap); S.got.showcase = true; render(); }, lost);
  db.collection("people").onSnapshot((snap) => { S.people = Object.fromEntries(docs(snap).map((d) => [d.id, d])); render(); }, lost);
})();
</script>
